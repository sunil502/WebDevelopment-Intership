
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App | Week 3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>🌤️ Weather App</h1>
        <p>Week 3 – JavaScript Logic & APIs</p>
    </header>

    <main class="container">

        <section class="weather-card">

            <h2>Check Current Weather</h2>

            <div class="search-box">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                    autocomplete="off"
                >

                <button id="searchBtn">
                    Search
                </button>

            </div>

            <p id="message" class="message"></p>

            <div id="weatherResult" class="weather-result">

                <div class="location">
                    <h2 id="cityName">City Name</h2>
                    <p id="countryName">Country</p>
                </div>

                <div class="weather-icon">
                    <img
                        id="weatherIcon"
                        src=""
                        alt="Weather Icon"
                    >
                </div>

                <div class="temperature">
                    <span id="temperature">--</span>°C
                </div>

                <p id="condition" class="condition">
                    Weather Condition
                </p>

                <div class="weather-details">

                    <div class="detail-box">
                        <span class="detail-icon">💧</span>
                        <p>Humidity</p>
                        <h3 id="humidity">--%</h3>
                    </div>

                    <div class="detail-box">
                        <span class="detail-icon">🌡️</span>
                        <p>Feels Like</p>
                        <h3 id="feelsLike">--°C</h3>
                    </div>

                    <div class="detail-box">
                        <span class="detail-icon">💨</span>
                        <p>Wind Speed</p>
                        <h3 id="windSpeed">-- m/s</h3>
                    </div>

                </div>

                <p id="updatedTime" class="updated-time"></p>

            </div>

        </section>

    </main>

    <footer class="footer">
        <p>
            Week 3 – Web Development Internship
        </p>

        <p>
            Built using HTML, CSS, JavaScript & OpenWeather API
        </p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
